name: daily-psx-scrape

on:
  # Mon-Fri 11:30 UTC = 4:30 PM Pakistan time (PSX closes ~3:30 PM)
  schedule:
    - cron: "30 11 * * 1-5"
  # Manual run. Default limit 5 = quick cloud test. Clear it for a full run.
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N tickers (empty = all)"
        required: false
        default: "5"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--days 5"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python scraper.py $ARGS"
          python scraper.py $ARGS

      - name: Upload Bronze files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: bronze/
          if-no-files-found: warn
          retention-days: 30