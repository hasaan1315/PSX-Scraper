name: daily-psx-scrape

on:
  # Started by cron-job.org (Mon-Fri 4:30 PM Pakistan time) through the GitHub API.
  # Manual run: Actions tab, Run workflow. Leave all boxes empty for a normal full run.
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma list, e.g. HBL,OGDC,LUCK. Empty = all tickers"
        required: false
        default: ""
      limit:
        description: "First N tickers only. Empty = all"
        required: false
        default: ""
      face_value:
        description: "Also scrape face values now (true/false)"
        required: false
        default: "false"

# A second run waits for the first instead of writing the same files at the same time
concurrency:
  group: psx-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          LIMIT: ${{ github.event.inputs.limit }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          ARGS="--days 5"
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --tickers $TICKERS"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python scraper.py $ARGS"
          python scraper.py $ARGS

      # Face values change rarely. Scrape them on the first Monday of each month,
      # or when the face_value box is set to true. Uses the dividend files written above.
      - name: Scrape face values (first Monday of the month, or on request)
        env:
          PYTHONUNBUFFERED: "1"
          FORCE: ${{ github.event.inputs.face_value }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          DAY=$(date -u +%d)
          WEEKDAY=$(date -u +%u)
          if [ "$FORCE" = "true" ] || { [ -z "$TICKERS" ] && [ "$DAY" -le 7 ] && [ "$WEEKDAY" = "1" ]; }; then
            python scrape_face_value.py
          else
            echo "Skipping face values (runs on the first Monday of the month, or set face_value = true)"
          fi

      - name: Upload to Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python upload_to_databricks.py

      - name: Upload Bronze files (backup artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: bronze/
          if-no-files-found: warn
          retention-days: 30