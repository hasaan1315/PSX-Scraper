name: daily-psx-scrape

on:
  # Mon-Fri 11:30 UTC = 4:30 PM Pakistan time (PSX closes ~3:30 PM)
  schedule:
    - cron: "30 11 * * 1-5"
  # Manual run. Default = 5 real stocks (quick cloud test).
  # Clear both boxes for a full run of all tickers.
  workflow_dispatch:
        inputs:
      tickers:
        description: "Comma list, e.g. HBL,OGDC,LUCK. Empty = all tickers"
        required: false
        default: ""
      limit:
        description: "First N tickers only. Empty = all"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          LIMIT: ${{ github.event.inputs.limit }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          ARGS="--days 5"
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --tickers $TICKERS"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python scraper.py $ARGS"
          python scraper.py $ARGS

      - name: Upload Bronze files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: bronze/
          if-no-files-found: warn
          retention-days: 30