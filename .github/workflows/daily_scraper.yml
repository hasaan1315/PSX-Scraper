name: daily-psx-scrape

on:
  # Triggered by cron-job.org (Mon-Fri 4:30 PM Pakistan time) via API
  # Manual run. Leave both boxes empty for a full run.
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma list, e.g. HBL,OGDC,LUCK. Empty = all tickers"
        required: false
        default: ""
      limit:
        description: "First N tickers only. Empty = all"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          LIMIT: ${{ github.event.inputs.limit }}
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          ARGS="--days 5"
          if [ -n "$TICKERS" ]; then ARGS="$ARGS --tickers $TICKERS"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python scraper.py $ARGS"
          python scraper.py $ARGS

      - name: Upload to Databricks Volume
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python upload_to_databricks.py

      - name: Upload Bronze files (backup artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronze-${{ github.run_id }}
          path: bronze/
          if-no-files-found: warn
          retention-days: 30