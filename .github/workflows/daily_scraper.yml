import requests, json

H = {"User-Agent": "Mozilla/5.0"}

r = requests.get("https://dps.psx.com.pk/timeseries/eod/HBL", headers=H, timeout=30)
print("EOD status:", r.status_code)
print(r.text[:500])

r = requests.get("https://dps.psx.com.pk/symbols", headers=H, timeout=30)
print("SYMBOLS status:", r.status_code)
print(json.dumps(r.json()[:2], indent=2))